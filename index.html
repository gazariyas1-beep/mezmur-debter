<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mezmur Debter Tewahedo</title>
<meta name="description" content="Ethiopian and Eritrean Orthodox Tewahedo hymns, with the video for every hymn.">
<meta property="og:type" content="website">
<meta property="og:title" content="Mezmur Debter Tewahedo">
<meta property="og:description" content="Ethiopian and Eritrean Orthodox Tewahedo hymns, with the video and lyrics for each.">
<meta property="og:image" content="https://mezmurdebterapp.gazariyas1.workers.dev/icons/icon-512.png">
<meta name="twitter:card" content="summary">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B2644">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mezmur Debter">
<meta name="application-name" content="Mezmur Debter">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Ethiopic:wght@400;700;800&family=Outfit:wght@300;400;500;600;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Ethiopic:wght@400;700;800&family=Outfit:wght@300;400;500;600;700&display=swap"></noscript>
<style>
:root{--bg:#F4F5F9;--surface:#FFFFFF;--ink:#1A2036;--muted:#5C6482;--line:#E1E5EF;--navy:#1B2644;--rust:#B4552B;--accent:#B4552B;--gold:#C9A24B;--chip:#E8EBF4;--pill:rgba(180,85,43,.14);--glow:radial-gradient(120% 55% at 50% 0%,rgba(201,162,75,.20),rgba(244,245,249,0) 70%);--bgtop:#FAF6EC;--bgbot:#F2F4F9;--bga:rgba(244,245,249,.88);--tabh:68px;
  --ui:"Outfit","Noto Serif Ethiopic","Abyssinica SIL",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--geez:"Noto Serif Ethiopic","Abyssinica SIL",serif;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1026;--surface:#151C3F;--ink:#ECEFF8;--muted:#A3ABCB;--line:#273055;--navy:#070B1D;--accent:#E0A93B;--chip:#1E2750;--pill:rgba(224,169,59,.2);--glow:radial-gradient(120% 55% at 50% 0%,rgba(224,169,59,.20),rgba(11,16,38,0) 70%);--bgtop:#0E1533;--bgbot:#080C1F;--bga:rgba(11,16,38,.88)}}
:root[data-theme="dark"]{--bg:#0B1026;--surface:#151C3F;--ink:#ECEFF8;--muted:#A3ABCB;--line:#273055;--navy:#070B1D;--accent:#E0A93B;--chip:#1E2750;--pill:rgba(224,169,59,.2);--glow:radial-gradient(120% 55% at 50% 0%,rgba(224,169,59,.20),rgba(11,16,38,0) 70%);--bgtop:#0E1533;--bgbot:#080C1F;--bga:rgba(11,16,38,.88)}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--ui);overscroll-behavior-y:none}
/* soft gold glow behind the app; the lyrics page stays flat so reading is easy */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--glow),linear-gradient(var(--bgtop),var(--bgbot))}
body[data-route="play"]::before{display:none}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid #E0A93B;outline-offset:2px}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.on{fill:currentColor}

/* top bar */
#bar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:env(safe-area-inset-top) max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left))}
.barin{height:56px;display:flex;align-items:center;gap:10px;max-width:720px;margin:0 auto}
.barin h1{font-size:1.15rem;font-weight:600;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barin h1 small{display:block;font-size:.72rem;font-weight:400;opacity:.75;letter-spacing:.08em;text-transform:uppercase;margin-top:-2px}
.mark{width:38px;height:38px;border-radius:50%;border:2px solid var(--gold);object-fit:cover;flex:none;margin-left:4px}
.iconbtn{width:44px;height:44px;border:0;background:none;color:inherit;display:grid;place-items:center;border-radius:50%;text-decoration:none;flex:none}
.iconbtn:active{background:rgba(255,255,255,.14)}

/* layout */
#view{max-width:720px;margin:0 auto;padding:14px max(14px,env(safe-area-inset-right)) calc(var(--tabh) + env(safe-area-inset-bottom) + 22px) max(14px,env(safe-area-inset-left))}
h2.sec{font-size:1.15rem;font-weight:700;margin:22px 0 10px;display:flex;align-items:baseline;justify-content:space-between}
h2.sec a{font-size:.88rem;font-weight:500;color:var(--accent);text-decoration:none}
.muted{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:48px 16px}
.empty .ic{width:44px;height:44px;margin-bottom:8px;opacity:.7}

/* tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#tabs a{flex:1;height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:500;color:var(--muted);text-decoration:none}
#tabs .pill{width:56px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .2s}
#tabs a[aria-current="page"]{color:var(--ink);font-weight:600}
#tabs a[aria-current="page"] .pill{background:var(--pill);color:var(--accent)}
#tabs a[aria-current="page"] .ic{stroke-width:2.1}
@media (prefers-reduced-motion:reduce){#tabs .pill{transition:none}}

/* verse banner */
.verse{background:linear-gradient(135deg,var(--navy),#2D3C6E);color:#fff;border-radius:18px;padding:20px 18px;border:1px solid rgba(201,162,75,.55)}
.verse p{margin:0;font:800 1.4rem/1.4 var(--geez)}
.verse small{display:block;margin-top:6px;color:var(--gold);letter-spacing:.06em;font-size:.82rem;text-transform:uppercase}

/* install card */
.install{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 12px 14px;margin-top:14px}
.install p{margin:0;flex:1;font-size:.92rem}
.install .go{background:var(--navy);color:#fff;border:0;border-radius:999px;padding:10px 16px;font-weight:600;white-space:nowrap}
.install .x{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;padding:6px 8px}

/* scrollers + cards */
.scroller{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -14px;padding:2px 14px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scroller::-webkit-scrollbar{display:none}
.card{flex:0 0 74%;max-width:290px;scroll-snap-align:start;text-decoration:none;background:var(--surface);border-radius:16px;overflow:hidden;border:1px solid var(--line);display:block}
.thumb{display:block;position:relative;aspect-ratio:16/9;background:var(--navy);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.78);color:#fff;font-style:normal;font-size:11px;font-weight:600;padding:2px 6px;border-radius:6px}
.card b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding:10px 12px 0;font-weight:600;line-height:1.35}
.card small{display:block;padding:2px 12px 12px;color:var(--muted);font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card b:last-child{padding-bottom:12px}

/* saint avatars */
.av{flex:0 0 84px;text-align:center;text-decoration:none;scroll-snap-align:start}
.av img{width:76px;height:76px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);background:var(--navy)}
.av span{display:block;font-size:12px;line-height:1.2;margin-top:6px;font-weight:500}
.av small{display:block;font-size:11px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:520px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:block}
.tile img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--navy)}
.tile span{display:block;padding:10px 12px 0;font-weight:600;line-height:1.25}
.tile small{display:block;padding:2px 12px 12px;color:var(--muted);font-size:.82rem}

/* search + chips */
.tools{position:sticky;top:calc(56px + env(safe-area-inset-top));z-index:10;background:var(--bga);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);margin:-14px -14px 4px;padding:12px 14px 8px}
.search{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 14px;font:inherit;font-size:16px;-webkit-appearance:none;appearance:none}
.chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:0;background:var(--chip);color:var(--ink);padding:8px 16px;border-radius:999px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--navy);color:#fff}
.count{color:var(--muted);font-size:.85rem;margin:8px 2px}

/* list rows */
.list{display:flex;flex-direction:column;gap:2px}
.row{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);content-visibility:auto;contain-intrinsic-size:auto 76px}
.rl{flex:1;min-width:0;display:flex;gap:12px;align-items:center;padding:10px 0;text-decoration:none}
.rl .thumb{flex:0 0 112px;border-radius:10px}
.rt{min-width:0;display:flex;flex-direction:column;gap:2px}
.rt b{font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rt small{color:var(--muted);font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{align-self:flex-start;font-style:normal;font-size:.7rem;font-weight:600;color:var(--accent);border:1px solid currentColor;border-radius:999px;padding:0 7px;margin-top:2px}
.fav{width:44px;height:44px;border:0;background:none;color:var(--muted);display:grid;place-items:center;border-radius:50%;flex:none}
.fav[aria-pressed="true"]{color:#D6453D}
.fav:active{background:var(--chip)}

/* saint header */
.shead{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.shead img{width:84px;height:84px;border-radius:18px;object-fit:cover;border:2px solid var(--gold)}
.shead h2{margin:0;font-size:1.25rem}

/* player */
.frame{position:relative;aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.frame p{position:absolute;inset:0;margin:0;display:grid;place-items:center;text-align:center;color:#fff;padding:20px}
.ptitle{font-size:1.35rem;line-height:1.3;margin:16px 0 2px;font-weight:700}
.psub{color:var(--muted);margin:0}
.acts{display:flex;gap:10px;margin:14px 0}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:600;text-decoration:none}
.btn.fav{width:auto;border-radius:14px;color:var(--ink)}
.btn.fav[aria-pressed="true"]{color:#D6453D}
.pn{display:flex;gap:10px}
.pn a{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-decoration:none;font-size:.85rem}
.pn a span{min-width:0;display:flex;flex-direction:column}
.pn a small{color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em}
.pn a b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn a.next{justify-content:flex-end;text-align:right}
.pn a.off{opacity:.35;pointer-events:none}
.lyrics{margin-top:22px;font:400 var(--lyr,1.2rem)/1.95 var(--geez)}
.lyrics p{margin:0 0 1.2em;white-space:pre-line}
.lyrics p.ch{font-weight:700;font-style:italic;border-left:3px solid var(--gold);padding-left:12px}
.lyhead{display:flex;align-items:center;justify-content:space-between;margin-top:24px}
.lyhead h2{margin:0;font-size:1.1rem}
.sz{display:flex;gap:6px}
.sz button{width:40px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}

/* more */
.group{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.group h3{margin:0 0 8px;font-size:1rem}
.group p{margin:0 0 8px;color:var(--muted)}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:9px 0;border-radius:10px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.link{display:inline-block;margin-top:4px;color:var(--accent);font-weight:600;text-decoration:none}
.foot{text-align:center;color:var(--muted);font:700 1rem var(--geez);margin:26px 0 6px}

/* reading mode, offline notice, reminder */
#offline{background:var(--chip);color:var(--ink);text-align:center;font-size:.85rem;padding:8px 14px}
.rdbtn{height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.85rem;margin-left:auto;margin-right:8px}
.reader{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.rtop{position:sticky;top:0;display:flex;align-items:center;gap:6px;background:var(--navy);color:#fff;height:calc(56px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 10px 0}
.rtop .rt1{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtop .sz button{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.25)}
.rbody{max-width:720px;margin:0 auto;padding:18px 18px calc(40px + env(safe-area-inset-bottom))}
.row2{display:flex;gap:10px;align-items:center}
.time{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px;font:inherit;font-size:16px}
.lyrics p{white-space:pre-line}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 16px);transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:40;border:1px solid rgba(255,255,255,.2)}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
[hidden]{display:none!important}
</style>
</head>
<body>
<header id="bar"></header>
<div id="offline" role="status" hidden>You’re offline. Lyrics and saved hymns still work, but videos need the internet.</div>
<main id="view" tabindex="-1"></main>
<nav id="tabs" aria-label="Main"></nav>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:2rem">Please turn on JavaScript to use this app.</p></noscript>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
