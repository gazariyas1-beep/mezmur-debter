name: Update videos
on:
  schedule:
    - cron: "17 6 * * *"   # once a day
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-videos
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -U yt-dlp
      - run: python scripts/update_videos.py
      - run: python scripts/save_covers.py
      - name: Save changes
        run: |
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          git add videos.json b
          git diff --cached --quiet || (git commit -m "Update videos" && git pull --rebase && git push)
      - name: Notify subscribers
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
        run: python scripts/notify.py
